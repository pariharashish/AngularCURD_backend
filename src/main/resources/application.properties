# Server Configuration
spring.application.name=AngularCURD_backend
server.port=8080

# CORS Configuration
app.cors.origins=http://localhost:4200

# Database Configuration (Configure as needed)
# spring.datasource.url=jdbc:mysql://localhost:3306/angular_curd
# spring.datasource.username=root
# spring.datasource.password=password
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false

# Swagger/Springdoc Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.use-root-path=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,applicationInfo,customEndpoint
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.AngularCURD=DEBUG
